version: "1.0.7.0"
targetAbi: "10.11.0.0"
framework: "net9.0"
overview: "Crea una biblioteca de series con el catálogo a la carta de RTVE Play (.strm + metadatos + subtítulos)."
description: >
  Resuelve el catálogo público de RTVE Play (programas, temporadas y episodios) y lo replica
  como biblioteca de series de Jellyfin mediante archivos .strm, con metadatos .nfo, carátulas
  y subtítulos SRT convertidos desde los WebVTT originales. La actualización se ejecuta con una
  tarea programada y desde la propia página de configuración del plugin.
category: "General"
# Repositorio propio del plugin (repositorio de plugins autoalojado). Este campo solo habría que
# cambiarlo si algún día se publica en el repositorio oficial de manifiestos de Jellyfin.
owner: "Lowitle"
artifacts:
  - "Jellyfin.Plugin.RtvePlay.dll"
changelog: >
  1.0.7.0: los recuentos del filtro «Tipo» siguen al filtro «Solo con vídeos», así que el número que
  muestra cada carpeta coincide con las filas que aparecen al elegirla. 1.0.6.0: el catálogo de programas ya no descarta los programas de radio al paginar, así que cada
  página trae siempre el mismo número de programas que devuelve RTVE y los filtros solo ocultan filas
  de la página cargada; el filtro «Tipo» pasa a ser la lista fija de las carpetas de la biblioteca
  (Películas, Series de TV, Documentales, Magacines, Programas de TV, Noticias, Infantil, Anime,
  Podcast, Archivo y Otros) con el recuento de la página, y llega «Solo con vídeos» para ocultar los
  programas de radio. Los programas del catálogo de Clan, que se descartaban por error, vuelven a
  aparecer. 1.0.5.0: la selección de programas pasa a ser una tabla con las columnas nombre, id, tipo de
  contenido y género, ordenable al pulsar cada cabecera y filtrable por texto, tipo y género, con
  «seleccionar los visibles» y «ocultar los ya añadidos», y la página de configuración usa el ancho
  completo en todas las secciones (Biblioteca, Subtítulos y Opciones ya no salen más estrechas que la
  lista de programas). 1.0.4.0: la carpeta de destino se organiza en subcarpetas por tipo de programa (peliculas,
  series-de-tv, documentales, magacines, programas-de-tv, noticias, infantil, anime, podcast, archivo y
  otros) para que la biblioteca se pueda navegar por secciones sin crear una biblioteca por tipo; los
  programas que ya estaban sueltos en la raíz se mueven solos a su subcarpeta en la primera
  sincronización, y la opción se puede desactivar. 1.0.3.0: el tvshow.nfo incluye los géneros del tipo de programa (Serie, Documental,
  Cine…), las categorías temáticas de RTVE, la etiqueta con el tipo exacto y, cuando RTVE lo publica, el id
  de IMDb, de modo que la biblioteca se puede filtrar por género o etiqueta desde Jellyfin; nueva opción para
  desactivar el id de IMDb si los proveedores online sobrescriben los datos del plugin. 1.0.2.0: botón
  «Crear biblioteca» que da de alta la carpeta de destino como biblioteca de
  «Programas de TV» (o añade la carpeta si ya existe), filtro de DRM desactivado por defecto —
  RTVE marca con hasDRM casi todo el catálogo aunque sirve el MP4/HLS sin cifrar, así que se
  dejaban programas enteros sin episodios—, migración automática de la configuración guardada,
  reintentos con espera creciente ante los 429/5xx de RTVE, avisos de diagnóstico de subtítulos y
  arreglo del listado «Ver todos los programas». 1.0.1.0: subtítulos multi-idioma con casillas
  (uno, varios o todos los que publique RTVE), listado paginado de todo el catálogo de programas
  para añadirlos seleccionándolos, botón «Comprobar carpeta» y mensaje claro cuando la carpeta
  de destino no está montada o no es escribible. 1.0.0.0: primera versión: sincronización de
  programas por id/slug/URL, preferencia de MP4 progresivo con fallback a HLS, filtrado opcional
  de contenido con DRM, subtítulos en es/en/ca/gl/eu y tarea programada con intervalo
  configurable.
